# ============================================================
# Shopkeepers 설정 파일
# 상점 시스템 - Mineage Hybrid 서버용
# ============================================================

# ============================================================
# 기본 설정
# ============================================================
# 상점 생성 비용
shop-creation-cost: 1000
# 1천 아데나

# ============================================================
# 상점 유형
# ============================================================
enabled-shop-types:
  - PLAYER_REGULAR
  - PLAYER_TRADING
  - ADMIN

# ============================================================
# NPC 설정
# ============================================================
npc:
  # 기본 NPC 타입
  default-type: VILLAGER
  
  # NPC 이름 표시
  show-names: true

# ============================================================
# 거래 설정
# ============================================================
trading:
  # 세금
  tax: 0.05
  # 5% 세금

# ============================================================
# 보호 설정
# ============================================================
protection:
  # 상점 파괴 방지
  prevent-shop-break: true
  
  # 상점 상호작용 제한
  owner-only-edit: true

# ============================================================
# GUI 설정
# ============================================================
gui:
  title: '&6상점'

# ============================================================
# 경제 설정
# ============================================================
economy:
  # Vault 사용
  use-vault: true

# ============================================================
# 저장 설정
# ============================================================
# 파일 기반 저장
save-interval: 300
# 5분마다 저장
