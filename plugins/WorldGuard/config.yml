# ============================================================
# WorldGuard 설정 파일
# 지역 보호 & PvP 구역 설정 - Mineage Hybrid 서버용
# ============================================================

# ============================================================
# 기본 설정
# ============================================================
# WorldEdit 플러그인 필요
use-paper-entity-origin-api: true

# ============================================================
# 지역 설정
# ============================================================
regions:
  # 지역 우선순위 사용
  use-scheduler: true
  
  # 최대 지역 수 (무제한)
  max-region-count-per-player:
    default: -1

# ============================================================
# 보호 설정
# ============================================================
protection:
  # 가상 지역 (전역 설정)
  virtual-region:
    # __global__ 지역 사용
    use-only-parent: false

# ============================================================
# PvP 설정
# ============================================================
gameplay:
  # 기본 PvP 설정
  default-player-pvp: true
  # 기본적으로 PvP 가능
  
  # 몹 스폰 설정
  mob-spawning:
    density-limit: 5
    # 청크당 최대 몹 수

# ============================================================
# 추천 지역 설정 (명령어로 생성 필요)
# ============================================================
# 안전존 (스폰 지역):
# /rg define spawn
# /rg flag spawn pvp deny
# /rg flag spawn mob-spawning deny
# /rg flag spawn mob-damage deny
# /rg flag spawn creeper-explosion deny
# /rg priority spawn 10
#
# PvP 존:
# /rg define pvp_zone
# /rg flag pvp_zone pvp allow
# /rg flag pvp_zone mob-spawning allow
# /rg priority pvp_zone 5
#
# AFK 자동사냥 존:
# /rg define afk_zone
# /rg flag afk_zone pvp deny
# /rg flag afk_zone mob-spawning allow
# /rg flag afk_zone mob-damage allow
# /rg priority afk_zone 5
#
# 성 점령전 지역:
# /rg define castle_siege
# /rg flag castle_siege pvp allow
# /rg flag castle_siege tnt allow
# /rg priority castle_siege 8

# ============================================================
# 블랙리스트/화이트리스트
# ============================================================
blacklist:
  # 블랙리스트 사용 안 함
  use-as-whitelist: false

# ============================================================
# 성능 설정
# ============================================================
performance:
  # 지역 캐시 크기
  region-cache-size: 500

# ============================================================
# 월드 설정
# ============================================================
worlds:
  world:
    # 메인 월드 설정
    use-scheduler: true
  
  world_nether:
    # 네더 설정
    use-scheduler: true
  
  world_the_end:
    # 엔드 설정
    use-scheduler: true
