# ============================================================
# LuckPerms 설정 파일
# 권한 관리 플러그인 - Mineage Hybrid 서버용
# ============================================================

# ============================================================
# 저장 방식 설정 (DB 금지 - YAML 파일 사용)
# ============================================================
storage-method: yaml
# yaml: 파일 기반 저장 (DB 불필요)
# h2: 로컬 데이터베이스 파일 (대안)
# sqlite: SQLite 파일 (대안)
# mysql, mariadb, postgresql, mongodb: 사용 금지!

# YAML 저장소 설정
data:
  # YAML 파일이 저장되는 경로
  pool-settings:
    # 최대 연결 수 (YAML에서는 사용 안 함)
    maximum-pool-size: 10
    # 최소 유휴 연결 수
    minimum-idle: 10
    # 최대 수명
    maximum-lifetime: 1800000
    # 연결 타임아웃
    connection-timeout: 5000

# ============================================================
# 서버 설정
# ============================================================
server: global
# global: 모든 서버에서 동일한 권한 사용
# 멀티 서버 네트워크가 아니면 'global' 사용

# ============================================================
# 동기화 설정
# ============================================================
watch-files: true
# true: 파일 변경 시 자동으로 리로드
# false: 수동 리로드 필요

# ============================================================
# 권한 그룹 설정
# ============================================================
# 기본 그룹
default-assignments:
  # 새 플레이어의 기본 그룹
  default: default

# ============================================================
# 메시지 설정
# ============================================================
messaging-service: none
# none: 단일 서버
# pluginmsg, redis, rabbitmq: 멀티 서버용 (사용 안 함)

# ============================================================
# 권한 계산 설정
# ============================================================
permission-calculation:
  # 부모 그룹 상속
  inherit-wildcards: true
  # 와일드카드 권한 사용
  apply-wildcards: true
  # 정규표현식 권한
  apply-regex: true
  # 단축키 권한
  apply-shorthand: true

# ============================================================
# 메타데이터 설정
# ============================================================
meta-formatting:
  # 접두사 형식
  prefix:
    format:
      - "highest"
    duplicates: first-only
    start-spacer: ""
    end-spacer: ""
  # 접미사 형식
  suffix:
    format:
      - "highest"
    duplicates: first-only
    start-spacer: ""
    end-spacer: ""

# ============================================================
# 웹 에디터 설정
# ============================================================
web-editor-url: "https://luckperms.net/editor/"
# 웹 에디터 URL (명령어: /lp editor)

# ============================================================
# 로그 설정
# ============================================================
log-notify: true
# true: 권한 변경 시 관리자에게 알림

# ============================================================
# 캐시 설정
# ============================================================
cache-ttl: 60
# 캐시 유지 시간 (초)

# ============================================================
# Vault 통합 설정
# ============================================================
vault-server: global
# Vault 권한 서버 이름

vault-include-global: true
# 전역 권한 포함

vault-ignore-world: false
# 월드별 권한 무시 여부

# ============================================================
# 기타 설정
# ============================================================
# 자동 저장 간격 (분)
auto-save-interval: 3

# 디버그 모드
debug: false

# 상세 로그
verbose-notifications: true

# ============================================================
# 추천 권한 그룹 구조 (수동 설정 필요)
# ============================================================
# /lp creategroup admin
# /lp group admin permission set * true
# /lp group admin meta setprefix "&c[관리자] "
#
# /lp creategroup player
# /lp group player permission set essentials.spawn true
# /lp group player permission set mmocore.class.choose true
# /lp group player meta setprefix "&7[플레이어] "
