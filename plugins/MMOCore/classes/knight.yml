# ============================================================
# 기사 (Knight) 클래스 설정
# 리니지 스타일 탱커/방어형 근접 전사
# ============================================================

# 클래스 ID (파일명과 동일해야 함)
id: knight

# 클래스 이름 (게임 내 표시)
display:
  name: '&6기사'
  lore:
    - '&7강력한 방어력과 체력을 가진 전사'
    - '&7최전방에서 아군을 보호하는 탱커'
    - ''
    - '&e주 능력: &f방어, 근접 전투'
    - '&e무기: &f검, 방패'

# 클래스 아이콘 (GUI에서 표시)
icon:
  material: IRON_SWORD
  name: '&6기사 (Knight)'

# ============================================================
# 기본 스탯
# ============================================================
stats:
  # 최대 체력
  max-health:
    base: 100
    # 시작 체력 100
    per-level: 5
    # 레벨당 +5 체력
  
  # 최대 마나
  max-mana:
    base: 50
    per-level: 1
    # 레벨당 +1 마나 (적음)
  
  # 최대 스태미나
  max-stamina:
    base: 50
    per-level: 1
  
  # 공격력
  attack-damage:
    base: 8
    per-level: 1.5
    # 레벨당 +1.5 공격력
  
  # 방어력
  defense:
    base: 10
    per-level: 2
    # 레벨당 +2 방어력 (높음)
  
  # 이동 속도
  movement-speed:
    base: 0.1
    per-level: 0.001
    # 약간 느린 편

# ============================================================
# 스탯 포인트 분배 옵션
# ============================================================
attributes:
  # 힘 (STR)
  strength:
    name: '&c힘'
    max: 99
    effects:
      - 'attack-damage:0.5'
      # 힘 1당 공격력 +0.5
  
  # 체력 (VIT)
  vitality:
    name: '&4체력'
    max: 99
    effects:
      - 'max-health:2'
      # 체력 1당 최대 HP +2
      - 'defense:0.3'
      # 체력 1당 방어력 +0.3
  
  # 민첩 (DEX)
  dexterity:
    name: '&a민첩'
    max: 99
    effects:
      - 'attack-speed:0.01'
      # 민첩 1당 공격 속도 +0.01
  
  # 지능 (INT)
  intelligence:
    name: '&9지능'
    max: 99
    effects:
      - 'max-mana:1'
      # 지능 1당 최대 마나 +1

# ============================================================
# 스킬 목록
# ============================================================
skills:
  # 스킬 1: 방패 막기
  shield_block:
    name: '&e방패 막기'
    max-level: 10
    material: SHIELD
    lore:
      - '&7일시적으로 받는 데미지를 감소시킵니다'
      - ''
      - '&e쿨다운: &f15초'
      - '&e마나 소모: &f20'
    unlock-level: 1
  
  # 스킬 2: 도발
  taunt:
    name: '&e도발'
    max-level: 10
    material: BELL
    lore:
      - '&7주변 적의 어그로를 끌어당깁니다'
      - ''
      - '&e쿨다운: &f20초'
      - '&e마나 소모: &f30'
    unlock-level: 10
  
  # 스킬 3: 강타
  power_strike:
    name: '&e강타'
    max-level: 10
    material: DIAMOND_SWORD
    lore:
      - '&7강력한 일격을 가합니다'
      - ''
      - '&e쿨다운: &f10초'
      - '&e마나 소모: &f25'
    unlock-level: 20
  
  # 스킬 4: 불굴의 의지
  iron_will:
    name: '&e불굴의 의지'
    max-level: 5
    material: TOTEM_OF_UNDYING
    lore:
      - '&7치명적인 데미지를 받아도 생존합니다'
      - ''
      - '&e쿨다운: &f300초'
      - '&e마나 소모: &f50'
    unlock-level: 50

# ============================================================
# 전직 옵션
# ============================================================
subclass:
  # 전직 가능 레벨
  min-level: 50
  
  # 전직 후 클래스 (없으면 최종 클래스)
  options: []

# ============================================================
# 장비 제한
# ============================================================
equipment:
  # 착용 가능한 무기
  weapons:
    - WOODEN_SWORD
    - STONE_SWORD
    - IRON_SWORD
    - GOLDEN_SWORD
    - DIAMOND_SWORD
    - NETHERITE_SWORD
    - SHIELD
  
  # 착용 가능한 방어구
  armor:
    - LEATHER_HELMET
    - LEATHER_CHESTPLATE
    - LEATHER_LEGGINGS
    - LEATHER_BOOTS
    - CHAINMAIL_HELMET
    - CHAINMAIL_CHESTPLATE
    - CHAINMAIL_LEGGINGS
    - CHAINMAIL_BOOTS
    - IRON_HELMET
    - IRON_CHESTPLATE
    - IRON_LEGGINGS
    - IRON_BOOTS
    - GOLDEN_HELMET
    - GOLDEN_CHESTPLATE
    - GOLDEN_LEGGINGS
    - GOLDEN_BOOTS
    - DIAMOND_HELMET
    - DIAMOND_CHESTPLATE
    - DIAMOND_LEGGINGS
    - DIAMOND_BOOTS
    - NETHERITE_HELMET
    - NETHERITE_CHESTPLATE
    - NETHERITE_LEGGINGS
    - NETHERITE_BOOTS

# ============================================================
# 경험치 보너스
# ============================================================
exp-sources:
  # 몹 처치 시 경험치 배율
  mob: 1.0
  # PvP 경험치 배율
  pvp: 1.0
  # 퀘스트 경험치 배율
  quest: 1.0
