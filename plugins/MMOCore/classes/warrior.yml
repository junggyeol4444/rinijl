# ============================================================
# 워리어 (Warrior) 클래스 설정
# 리니지 스타일 공격형 근접 딜러
# ============================================================

id: warrior

display:
  name: '&c워리어'
  lore:
    - '&7강력한 공격력을 가진 전사'
    - '&7빠르고 강한 공격으로 적을 제압'
    - ''
    - '&e주 능력: &f공격, 근접 전투'
    - '&e무기: &f도끼, 검'

icon:
  material: IRON_AXE
  name: '&c워리어 (Warrior)'

# ============================================================
# 기본 스탯
# ============================================================
stats:
  max-health:
    base: 80
    per-level: 4
    # 기사보다 낮은 체력
  
  max-mana:
    base: 40
    per-level: 1
  
  max-stamina:
    base: 60
    per-level: 1.5
  
  attack-damage:
    base: 12
    per-level: 2
    # 높은 공격력
  
  defense:
    base: 5
    per-level: 1
    # 낮은 방어력
  
  movement-speed:
    base: 0.12
    per-level: 0.002
    # 빠른 이동속도

# ============================================================
# 스탯 포인트 분배
# ============================================================
attributes:
  strength:
    name: '&c힘'
    max: 99
    effects:
      - 'attack-damage:1'
      # 힘 1당 공격력 +1 (높음)
  
  vitality:
    name: '&4체력'
    max: 99
    effects:
      - 'max-health:1.5'
      - 'defense:0.2'
  
  dexterity:
    name: '&a민첩'
    max: 99
    effects:
      - 'attack-speed:0.015'
      - 'movement-speed:0.001'
  
  intelligence:
    name: '&9지능'
    max: 99
    effects:
      - 'max-mana:0.5'

