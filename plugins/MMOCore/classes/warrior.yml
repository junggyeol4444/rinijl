  # 스킬 3: 돌진
  charge:
    name: '&e돌진'
    max-level: 10
    material: FEATHER
    lore:
      - '&7앞으로 빠르게 돌진하며 데미지를 입힙니다'
      - ''
      - '&e쿨다운: &f15초'
      - '&e스태미나 소모: &f25'
    unlock-level: 20
  
  # 스킬 4: 광전사
  berserker:
    name: '&e광전사'
    max-level: 5
    material: BLAZE_POWDER
    lore:
      - '&7체력이 낮을수록 공격력이 증가합니다'
      - '&7패시브 스킬'
      - ''
      - '&e마나 소모: &f없음'
