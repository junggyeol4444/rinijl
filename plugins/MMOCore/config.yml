# ============================================================
# MMOCore 설정 파일
# RPG 클래스 & 레벨링 시스템 - Mineage Hybrid 서버용
# 최대 레벨 99, 전직 시스템 포함
# ============================================================

# ============================================================
# 기본 설정
# ============================================================
# 플레이어가 처음 접속할 때 클래스 선택 GUI 표시
force-class-selection: true

# 최대 레벨 설정
max-level: 99
# 리니지 스타일 최대 레벨 99

# 사용할 경험치 시스템
use-vanilla-exp: false
# false: MMOCore 자체 경험치 시스템 사용

# ============================================================
# 경험치 설정
# ============================================================
experience:
  # 경험치 배율
  multiplier: 1.0
  
  # 레벨업에 필요한 경험치 공식
  # {level}: 현재 레벨
  formula: '100 * {level} + 50 * {level} ^ 2'
  # 레벨이 높을수록 기하급수적으로 증가
  
  # 몹 처치 시 경험치
  mob:
    # 기본 경험치
    base: 10
    
    # 몹 레벨당 추가 경험치
    per-level: 5
  
  # PvP 경험치
  pvp:
    enabled: true
    amount: 50
    # 플레이어 처치 시 50 경험치

# ============================================================
# 스탯 포인트 설정
# ============================================================
stat-points:
  # 레벨업 시 획득하는 스탯 포인트
  per-level: 3
  # 매 레벨마다 3 포인트 획득
  
  # 스탯 초기화 가능 여부
  reset-enabled: true
  
  # 스탯 초기화 비용 (아데나)
  reset-cost: 50000
  # 5만 아데나

# ============================================================
# 스킬 포인트 설정
# ============================================================
skill-points:
  # 레벨업 시 획득하는 스킬 포인트
  per-level: 1
  # 매 레벨마다 1 포인트 획득
  
  # 시작 스킬 포인트
  starting: 0

# ============================================================
# 전직 시스템 설정
# ============================================================
class-change:
  # 전직 가능 여부
  enabled: true
  
  # 전직 비용 (아데나)
  cost: 100000
  # 10만 아데나
  
  # 전직 시 레벨 유지
  keep-level: false
  # false: 레벨 1로 초기화
  
  # 전직 가능 최소 레벨
  min-level: 50
  # 50레벨부터 전직 가능

# ============================================================
# 전투 설정
# ============================================================
combat:
  # 전투 중 상태 지속 시간 (초)
  timer: 10
  # 10초 동안 전투 중 상태 유지
  
  # 전투 중 명령어 제한
  disable-commands: true
  
  # 전투 중 사용 불가 명령어
  blocked-commands:
    - 'spawn'
    - 'home'
    - 'tpa'
    - 'warp'

# ============================================================
# 파티 시스템 설정
# ============================================================
party:
  # 파티 시스템 활성화
  enabled: true
  
  # 최대 파티원 수
  max-members: 5
  
  # 파티 경험치 공유
  share-exp: true
  
  # 경험치 공유 반경
  exp-share-radius: 50

# ============================================================
# 길드(혈맹) 연동 설정
# ============================================================
guild:
  # 길드 시스템 사용 (SaberFactions 사용)
  enabled: false
  # false: SaberFactions로 대체

# ============================================================
# 마나 시스템 설정
# ============================================================
mana:
  # 마나 재생 속도 (초당)
  regen-rate: 1.0
  
  # 전투 중 마나 재생
  regen-in-combat: false
  # false: 전투 중에는 마나 재생 안 됨

# ============================================================
# 스태미나 시스템 설정
# ============================================================
stamina:
  # 스태미나 재생 속도 (초당)
  regen-rate: 1.0
  
  # 전투 중 스태미나 재생
  regen-in-combat: false

# ============================================================
# 사망 설정
# ============================================================
death:
  # 사망 시 경험치 손실 비율
  exp-loss: 0.1
  # 10% 경험치 손실
  
  # 레벨 다운 가능 여부
  level-down: false
  # false: 레벨은 내려가지 않음
  
  # 사망 시 아이템 드랍
  item-drop: true

# ============================================================
# 속성 데미지 설정
# ============================================================
damage:
  # PvP 데미지 배율
  pvp-multiplier: 1.0
  
  # PvE 데미지 배율
  pve-multiplier: 1.0

# ============================================================
# GUI 설정
# ============================================================
gui:
  # 클래스 선택 GUI 제목
  class-selection-title: '&6클래스 선택'
  
  # 스킬 트리 GUI 제목
  skill-tree-title: '&6스킬 트리'
  
  # 스탯 GUI 제목
  stats-title: '&6스탯 분배'

# ============================================================
# 레벨업 메시지
# ============================================================
messages:
  # 레벨업 메시지
  level-up:
    - '&e━━━━━━━━━━━━━━━━━━━━━━━━━━'
    - '&6&l레벨 업! &e{level}'
    - '&7스탯 포인트 &a+{stat_points}'
    - '&7스킬 포인트 &a+{skill_points}'
    - '&e━━━━━━━━━━━━━━━━━━━━━━━━━━'
  
  # 클래스 선택 메시지
  class-select: '&a{class} &7클래스를 선택했습니다!'
  
  # 전직 메시지
  class-change: '&a{new_class}&7로 전직했습니다!'

# ============================================================
# 데이터베이스 설정 (사용하지 않음)
# ============================================================
mysql:
  enabled: false
  # false: 파일 기반 저장 사용

# ============================================================
# 저장 설정
# ============================================================
save:
  # 자동 저장 간격 (분)
  interval: 5
  # 5분마다 자동 저장
  
  # 비동기 저장
  async: true

# ============================================================
# 액션바 설정
# ============================================================
action-bar:
  # 액션바 표시 활성화
  enabled: true
  
  # 표시 형식
  format: '&c❤ {health}/{max_health} &9✦ {mana}/{max_mana} &eLv.{level}'

# ============================================================
# 추천 클래스 파일 목록
# ============================================================
# plugins/MMOCore/classes/
# - knight.yml (기사)
# - warrior.yml (워리어)
# - mage.yml (마법사)
# - elf.yml (요정)
# - darkelf.yml (다크엘프)
