# ============================================================
# SaberFactions 설정 파일
# 혈맹 시스템 - Mineage Hybrid 서버용
# ============================================================

# ============================================================
# 기본 설정
# ============================================================
factions:
  # 혈맹 시스템 활성화
  enabled: true
  
  # 혈맹 이름 최소 길이
  name-min-length: 3
  
  # 혈맹 이름 최대 길이
  name-max-length: 16
  
  # 혈맹 태그 최소 길이
  tag-min-length: 2
  
  # 혈맹 태그 최대 길이
  tag-max-length: 6

# ============================================================
# 혈맹 생성 설정
# ============================================================
create:
  # 혈맹 생성 비용 (아데나)
  cost: 10000
  # 1만 아데나
  
  # 생성 시 필요한 최소 레벨
  min-level: 10

# ============================================================
# 혈맹원 설정
# ============================================================
members:
  # 최대 혈맹원 수
  max-members: 50
  # 기본 50명
  
  # 승급 혈맹원 수에 따른 확장
  member-limit-by-power:
    enabled: true
    base: 50
    per-power: 1
    # 파워 1당 1명 추가

# ============================================================
# 영지 (Claim) 설정
# ============================================================
claims:
  # 영지 점령 활성화
  enabled: true
  
  # 청크당 점령 비용 (아데나)
  cost-per-chunk: 5000
  # 청크 1개당 5천 아데나
  
  # 최대 점령 가능 청크 수
  max-claims: 100
  
  # 혈맹 파워에 따른 청크 제한
  claims-per-power: 1
  # 파워 1당 청크 1개
  
  # 영지 자동 점령 방지
  require-faction-nearby: true
  
  # 영지 보호
  protection:
    # 비혈맹원의 블록 파괴 방지
    prevent-block-break: true
    
    # 비혈맹원의 블록 설치 방지
    prevent-block-place: true
    
    # 비혈맹원의 상호작용 방지
    prevent-interaction: true

# ============================================================
# 혈맹전 설정
# ============================================================
war:
  # 혈맹전 시스템 활성화
  enabled: true
  
  # 혈맹전 선포 비용 (아데나)
  declare-cost: 50000
  # 5만 아데나
  
  # 혈맹전 최소 인원
  min-members: 5
  # 양측 모두 5명 이상
  
  # 혈맹전 중 PvP
  pvp-in-war: true
  
  # 혈맹전 승리 보상
  victory-reward:
    money: 100000
    # 10만 아데나
    exp: 500
    # MMOCore 경험치 500

# ============================================================
# PvP 설정
# ============================================================
pvp:
  # 자기 혈맹원 공격 불가
  friendly-fire: false
  
  # 동맹 혈맹 공격 불가
  ally-fire: false
  
  # 중립 혈맹 공격 가능
  neutral-attack: true
  
  # 적대 혈맹 공격 가능
  enemy-attack: true

# ============================================================
# 파워 시스템
# ============================================================
power:
  # 시작 파워
  starting-power: 10
  
  # 최대 파워
  max-power: 100
  
  # 파워 재생 속도 (분당)
  regen-rate: 1
  # 1분마다 1 파워 재생
  
  # 사망 시 파워 손실
  death-loss: 5
  # 사망 시 -5 파워
  
  # 킬 시 파워 획득
  kill-gain: 2
  # 적 처치 시 +2 파워

# ============================================================
# 관계 설정
# ============================================================
relations:
  # 동맹 최대 개수
  max-allies: 5
  
  # 적대 최대 개수
  max-enemies: 10
  
  # 동맹 요청 만료 시간 (초)
  ally-request-timeout: 300
  # 5분

# ============================================================
# 홈 설정
# ============================================================
home:
  # 혈맹 홈 텔레포트 활성화
  enabled: true
  
  # 텔레포트 딜레이 (초)
  teleport-delay: 5
  
  # 전투 중 텔레포트 불가
  cancel-on-damage: true

# ============================================================
# 경제 설정
# ============================================================
economy:
  # Vault 연동
  vault-enabled: true
  
  # 혈맹 은행 시스템
  bank-enabled: true
  
  # 혈맹 생성 시 시작 자금
  starting-balance: 0

# ============================================================
# 랭킹 설정
# ============================================================
ranking:
  # 랭킹 시스템 활성화
  enabled: true
  
  # 랭킹 기준
  # power, members, land, money
  criteria: power
  
  # 상위 랭킹 혈맹 혜택 (별도 Skript 구현)
  # 1위: AFK 존 XP 2배 버프

# ============================================================
# 메시지 설정
# ============================================================
messages:
  # 혈맹 생성
  create: '&a혈맹 &e{faction}&a을(를) 생성했습니다!'
  
  # 혈맹 가입
  join: '&a{player}&7님이 혈맹에 가입했습니다.'
  
  # 혈맹 탈퇴
  leave: '&c{player}&7님이 혈맹을 탈퇴했습니다.'
  
  # 혈맹전 선포
  war-declare: '&c{attacker}&7이(가) &c{defender}&7에게 혈맹전을 선포했습니다!'
  
  # 영지 점령
  claim: '&a이 땅을 점령했습니다!'

# ============================================================
# 채팅 설정
# ============================================================
chat:
  # 혈맹 채팅 활성화
  faction-chat: true
  
  # 혈맹 채팅 형식
  faction-format: '&6[혈맹] &e{player}&7: {message}'
  
  # 동맹 채팅 활성화
  ally-chat: true
  
  # 동맹 채팅 형식
  ally-format: '&a[동맹] &e{player}&7: {message}'

# ============================================================
# 권한 설정
# ============================================================
permissions:
  # 직책별 권한
  leader:
    # 혈맹장 권한
    - invite
    - kick
    - claim
    - unclaim
    - sethome
    - setwarp
    - disband
    - relation
    - promote
    - demote
  
  officer:
    # 부혈맹장 권한
    - invite
    - kick
    - claim
    - unclaim
    - setwarp
  
  member:
    # 일반 혈맹원 권한
    - home
    - warp

# ============================================================
# 데이터베이스 설정 (사용하지 않음)
# ============================================================
database:
  # JSON 파일 저장 사용
  type: json
  # json, mysql 중 선택 (json 사용)

# ============================================================
# 기타 설정
# ============================================================
# 혈맹 해체 시 환불
disband-refund: 0.5
# 50% 환불

# 비활동 자동 해체 (일)
auto-disband-days: 60
# 60일 동안 접속 없으면 해체

# 영지 표시
show-territory-titles: true
# 영지 진입 시 제목 표시
