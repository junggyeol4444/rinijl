# ============================================================
# mcMMO 설정 파일
# 보조 스킬 시스템 - Mineage Hybrid 서버용
# DB 금지 - 파일 저장 사용
# ============================================================

# ============================================================
# 데이터베이스 설정 (사용하지 않음)
# ============================================================
MySQL:
  Enabled: false
  # false: MySQL 사용 안 함

# 파일 기반 저장 사용 (FlatFile)
General:
  Save_Interval: 10
  # 10분마다 자동 저장

# ============================================================
# 경험치 설정
# ============================================================
Experience_Formula:
  # 경험치 배율
  Multiplier:
    Global: 1.0
    # 전역 경험치 1배
  
  # 레벨업 공식
  Curve:
    Enabled: true

# ============================================================
# 스킬 설정
# ============================================================
Skills:
  # 전반적인 설정
  General:
    # 스킬 최대 레벨
    Max_Levels:
      Default: 1000
      # 기본 최대 레벨 1000
  
  # 개별 스킬 설정
  Acrobatics:
    Enabled: true
    # 곡예 스킬
  
  Alchemy:
    Enabled: true
    # 연금술
  
  Archery:
    Enabled: true
    # 궁술
  
  Axes:
    Enabled: true
    # 도끼 전투
  
  Excavation:
    Enabled: true
    # 발굴
  
  Fishing:
    Enabled: true
    # 낚시
  
  Herbalism:
    Enabled: true
    # 약초학
  
  Mining:
    Enabled: true
    # 채광
  
  Repair:
    Enabled: true
    # 수리
  
  Salvage:
    Enabled: true
    # 회수
  
  Smelting:
    Enabled: true
    # 제련
  
  Swords:
    Enabled: true
    # 검 전투
  
  Taming:
    Enabled: true
    # 야생 동물 길들이기
  
  Unarmed:
    Enabled: true
    # 맨손 전투
  
  Woodcutting:
    Enabled: true
    # 벌목

# ============================================================
# 능력 쿨다운
# ============================================================
Abilities:
  Cooldowns:
    # 능력 재사용 대기시간 (초)
    Berserk: 240
    Blast_Mining: 60
    Giga_Drill_Breaker: 240
    Green_Terra: 240
    Serrated_Strikes: 240
    Skull_Splitter: 240
    Super_Breaker: 240
    Tree_Feller: 240

# ============================================================
# 파티 설정
# ============================================================
Party:
  # 파티 시스템 활성화
  Enabled: true
  
  # 경험치 공유
  Sharing:
    ExpShare_enabled: true
    Range: 75.0
    # 75블록 이내 경험치 공유

# ============================================================
# 리더보드 설정
# ============================================================
Scoreboard:
  # 스코어보드 표시
  UseScoreboards: true
  
  # 랭킹 표시
  Use_Leaderboards: true

# ============================================================
# 보상 설정
# ============================================================
Rewards:
  # 레벨업 시 명령어 실행
  Enabled: false

# ============================================================
# 채팅 설정
# ============================================================
Chat:
  # 레벨업 메시지
  Notifications:
    Show_Level_Up: true
    Show_Ability_Unlocked: true

# ============================================================
# 호환성 설정
# ============================================================
Compatibility:
  # 다른 플러그인과의 호환성
  Layer_Name: mcMMO

# ============================================================
# 백업 설정
# ============================================================
Backups:
  # 자동 백업 활성화
  Enabled: true
  
  # 백업 유지 개수
  KeepLast: 10
