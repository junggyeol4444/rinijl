# ============================================================
# AuctionHouse 설정 파일
# 경매 시스템 - Mineage Hybrid 서버용
# ============================================================

# ============================================================
# 기본 설정
# ============================================================
# 경매장 제목
auction-house-title: '&6경매장'

# ============================================================
# 경매 설정
# ============================================================
auction:
  # 최소 경매 가격
  min-price: 1
  
  # 최대 경매 가격
  max-price: 1000000000
  # 10억 아데나
  
  # 경매 지속 시간 (초)
  duration: 86400
  # 24시간
  
  # 최대 동시 출품 수
  max-auctions-per-player: 10

# ============================================================
# 수수료 설정
# ============================================================
fees:
  # 출품 수수료
  listing-fee: 0.05
  # 5% 수수료
  
  # 판매 수수료
  selling-fee: 0.03
  # 3% 수수료

# ============================================================
# 경제 설정
# ============================================================
economy:
  # Vault 사용
  use-vault: true

# ============================================================
# GUI 설정
# ============================================================
gui:
  # 페이지당 아이템 수
  items-per-page: 45

# ============================================================
# 메시지 설정
# ============================================================
messages:
  # 출품 성공
  listed: '&a아이템을 경매장에 출품했습니다!'
  
  # 구매 성공
  bought: '&a아이템을 구매했습니다!'
  
  # 판매 완료
  sold: '&a당신의 아이템이 판매되었습니다!'

# ============================================================
# 필터 설정
# ============================================================
filters:
  # 금지 아이템
  blacklist:
    - BEDROCK
    - BARRIER
    - COMMAND_BLOCK

# ============================================================
# 데이터베이스 (SQLite 사용)
# ============================================================
storage:
  type: sqlite
