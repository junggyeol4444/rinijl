# ============================================================
# 오크 (Orc) 몹 설정
# 리니지 스타일 중급 몹
# ============================================================

# 몹 ID (소환 시 사용)
orc:
  # 몹 타입 (기본 엔티티)
  Type: ZOMBIE
  
  # 표시 이름
  Display: '&c오크 &7[Lv.15]'
  
  # 체력
  Health: 100
  
  # 방어력
  Damage: 8
  
  # 이동 속도
  MovementSpeed: 0.25
  
  # ============================================================
  # 장비 설정
  # ============================================================
  Equipment:
    - IRON_SWORD:0 HAND
    # 철 검 착용
    - LEATHER_HELMET:0 HEAD
    - LEATHER_CHESTPLATE:0 CHEST
    - LEATHER_LEGGINGS:0 LEGS
    - LEATHER_BOOTS:0 FEET
  
  # ============================================================
  # 드랍 아이템 설정
  # ============================================================
  Drops:
    # 아데나 드랍 (Essentials 연동)
    - money{amount=50-100} 1.0
    # 50~100 아데나를 100% 확률로 드랍
    
    # 일반 아이템 드랍
    - IRON_SWORD 0.05
    # 철 검 5% 확률
    - LEATHER_CHESTPLATE 0.03
    # 가죽 갑옷 3% 확률
    - COOKED_BEEF 0.5
    # 구운 고기 50% 확률
    - BONE 0.3
    # 뼈 30% 확률
  
  # ============================================================
  # 경험치 설정 (MMOCore 연동)
  # ============================================================
  Options:
    # 처치 시 MMOCore 경험치
    MMOCoreExp: 25
    # 25 경험치 제공
    
    # 몹 레벨
    Level: 15
    
    # 항상 적대적
    AlwaysShowName: true
    
    # 이름표 표시 거리
    NameplateHeight: 0.5
    
    # 햇빛에 타지 않음
    PreventSunburn: true
    
    # 물에서 익사하지 않음
    PreventOtherDrops: true
  
  # ============================================================
  # AI 및 행동 설정
  # ============================================================
  AIGoalSelectors:
    # 가까운 플레이어 공격
    - clear
    - meleeattack
    - randomstroll
    - float
  
  AITargetSelectors:
    # 플레이어를 타겟으로 설정
    - clear
    - players
    - attacker
  
  # ============================================================
  # 스킬 설정
  # ============================================================
  Skills:
    # 전투 시작 시 포효
    - message{m="&c오크: 크아아악!"} @PlayersInRadius{r=10} ~onCombat
    
    # 30% 확률로 강타
    - damage{a=15} @target ~onAttack 0.3
    
    # 체력 50% 이하일 때 분노
    - effect:INCREASE_DAMAGE{d=200;l=1} @self ~onDamaged 0.1 >50%
  
  # ============================================================
  # 파티클 효과
  # ============================================================
  Particles:
    - effect:ANGRY_VILLAGER @self ~onCombat
    # 전투 시 분노 파티클

# ============================================================
# 스폰 설정 (별도 파일 또는 월드 설정)
# ============================================================
# /mm mobs spawn orc 명령어로 수동 소환
# 또는 MythicMobs의 RandomSpawns 기능 사용
