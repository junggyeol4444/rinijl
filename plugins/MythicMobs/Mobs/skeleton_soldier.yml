# ============================================================
# 스켈레톤 솔져 (Skeleton Soldier) 몹 설정
# 리니지 스타일 중급 언데드 전사
# ============================================================

skeleton_soldier:
  # 몹 타입
  Type: SKELETON
  
  # 표시 이름
  Display: '&7스켈레톤 솔져 &8[Lv.20]'
  
  # 체력
  Health: 120
  
  # 공격력
  Damage: 10
  
  # 이동 속도
  MovementSpeed: 0.28
  
  # ============================================================
  # 장비 설정
  # ============================================================
  Equipment:
    - IRON_SWORD:0 HAND
    # 활이 아닌 검 착용
    - IRON_HELMET:0 HEAD
    - IRON_CHESTPLATE:0 CHEST
    - IRON_LEGGINGS:0 LEGS
    - IRON_BOOTS:0 FEET
  
  # ============================================================
  # 드랍 아이템 설정
  # ============================================================
  Drops:
    # 아데나 드랍
    - money{amount=70-150} 1.0
    # 70~150 아데나
    
    # 아이템 드랍
    - IRON_SWORD 0.08
    - IRON_HELMET 0.05
    - BONE 0.8
    # 뼈 80% (언데드 특성)
    - ARROW 0.4
    - BOW 0.03
    - IRON_INGOT 0.1
  
  # ============================================================
  # 경험치 설정
  # ============================================================
  Options:
    MMOCoreExp: 35
    # 35 경험치
    Level: 20
    AlwaysShowName: true
    NameplateHeight: 0.5
    PreventSunburn: false
    # 낮에 햇빛에 탐 (언데드 특성)
    PreventOtherDrops: true
  
  # ============================================================
  # AI 설정
  # ============================================================
  AIGoalSelectors:
    - clear
    - meleeattack
    - avoidplayer{speed=1.3;d=5} ~onDamaged
    # 피해를 받으면 잠시 후퇴
    - randomstroll
    - float
  
  AITargetSelectors:
    - clear
    - players
    - attacker
  
  # ============================================================
  # 스킬 설정
  # ============================================================
  Skills:
    # 전투 시작
    - message{m="&7스켈레톤 솔져: 딸그락..."} @PlayersInRadius{r=10} ~onCombat
    
    # 빠른 연속 공격 (25% 확률)
    - damage{a=5} @target ~onAttack 0.25
    - damage{a=5} @target ~onAttack{delay=10} 0.25
    
    # 방어 태세 (30% 확률)
    - effect:RESISTANCE{d=100;l=1} @self ~onDamaged 0.3
    
    # 사망 시 폭발
    - explosion{yield=0;fire=false} @self ~onDeath 1.0
    - message{m="&8스켈레톤 솔져가 산산조각났다!"} @PlayersInRadius{r=15} ~onDeath
  
  # ============================================================
  # 파티클 효과
  # ============================================================
  Particles:
    - effect:SMOKE_NORMAL @self ~onTimer:80
    # 언데드 연기 효과
