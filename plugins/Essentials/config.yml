# ============================================================
# Essentials 설정 파일
# 기본 명령어 & 경제 시스템 - Mineage Hybrid 서버용
# 화폐 단위: 아데나 (리니지 스타일)
# ============================================================

# ============================================================
# 화폐 설정 (아데나)
# ============================================================
currency-symbol: '아데나'
# 화폐 단위 이름

currency-symbol-format-locale: ko_KR
# 한국어 로케일

# ============================================================
# 경제 시스템 설정
# ============================================================
economy:
  # 시작 자금
  starting-balance: 1000
  # 신규 플레이어가 1000 아데나로 시작
  
  # 최대 보유 금액
  max-money: 10000000000
  # 최대 100억 아데나
  
  # 최소 보유 금액
  min-money: 0
  # 음수 잔액 불가

# ============================================================
# 스폰 설정
# ============================================================
spawn-on-join: true
# 첫 접속 시 스폰으로 이동

spawn-if-no-home: true
# 집이 없으면 스폰으로 이동

# 리스폰 위치
respawn-at-home: false
# 집에서 리스폰하지 않고 스폰에서 리스폰

# ============================================================
# 텔레포트 설정
# ============================================================
teleport-cooldown: 60
# 텔레포트 쿨다운 60초

teleport-delay: 3
# 텔레포트 3초 딜레이

teleport-safety: true
# 안전한 위치로 텔레포트

# ============================================================
# 홈 설정
# ============================================================
max-homes: 3
# 기본 플레이어는 집 3개까지

sethome-multiple:
  # 그룹별 홈 개수 설정
  default: 3
  vip: 5
  admin: 10

# ============================================================
# 채팅 설정
# ============================================================
chat:
  # 채팅 형식
  format: '<{DISPLAYNAME}> {MESSAGE}'
  # 플레이어 이름과 메시지 형식
  
  # 채팅 반경 (0 = 전체)
  radius: 0
  
  # 욕설 필터
  filter-colors: false

# ============================================================
# 닉네임 설정
# ============================================================
nickname:
  # 닉네임 접두사
  prefix: '~'
  
  # 닉네임 최대 길이
  max-length: 20
  
  # 닉네임 최소 길이
  min-length: 3

# ============================================================
# 개인 메시지 설정
# ============================================================
msg:
  # 메시지 형식
  format: '&7[&6{0}&7 -> &6{1}&7] &f{2}'

# ============================================================
# AFK (자리비움) 설정
# ============================================================
afk:
  # AFK 자동 인식 시간 (초)
  auto: 300
  # 5분 동안 움직임 없으면 자동 AFK
  
  # AFK 시 킥 시간 (0 = 비활성화)
  kick: 0
  # AFK 상태에서는 킥하지 않음 (자동사냥 존 때문)
  
  # AFK 시 무적
  freeze-afk-players: false

# ============================================================
# 키트 설정
# ============================================================
kits:
  # 시작 키트
  starter:
    delay: 86400
    # 24시간마다 사용 가능
    items:
      - 'STONE_SWORD 1'
      - 'BREAD 10'
      - 'POTION 1 name:&6체력_물약 lore:HP_회복'

# ============================================================
# 백팩 설정
# ============================================================
enable-inventory-backups: true
# 인벤토리 백업 활성화

# ============================================================
# 사망 설정
# ============================================================
death-messages: true
# 사망 메시지 표시

# ============================================================
# 로그인/로그아웃 메시지
# ============================================================
show-join-messages: true
show-quit-messages: true

# 커스텀 메시지
custom-join-message: '&e{PLAYER}&7님이 접속하셨습니다!'
custom-quit-message: '&e{PLAYER}&7님이 퇴장하셨습니다.'

# ============================================================
# 지역 보호 설정
# ============================================================
protect:
  # 스폰 보호 반경
  spawn-radius: 50
  
  # 크리퍼 폭발 방지
  creeper:
    explosion: false
    blockdamage: false
  
  # TNT 폭발
  tnt:
    explosion: true
    blockdamage: true

# ============================================================
# 명령어 쿨다운
# ============================================================
command-cooldowns:
  # 명령어별 쿨다운 (초)
  tpa: 60
  home: 10
  spawn: 5
  warp: 10

# ============================================================
# 비활성화할 명령어
# ============================================================
disabled-commands:
  # 사용하지 않을 명령어 목록
  # - op
  # - deop

# ============================================================
# 월드 설정
# ============================================================
world-time-permissions: false
# 월드 시간 변경 권한 제한

# ============================================================
# 기타 설정
# ============================================================
# 사인(표지판) 사용
signs-disabled: false

# 수리 명령어
repair:
  # 수리 비용
  enchanted-fee: 1000
  # 인챈트 아이템 수리: 1000 아데나
  
  unenchanted-fee: 500
  # 일반 아이템 수리: 500 아데나

# ============================================================
# 경험치 명령어
# ============================================================
give-exp-command-enabled: true

# ============================================================
# 백업 설정
# ============================================================
backup:
  # 자동 백업 간격 (분)
  interval: 60
  
  # 백업 보관 개수
  always-keep: 3

# ============================================================
# 리스트 명령어 설정
# ============================================================
list:
  # 플레이어 목록 형식
  format: '&7온라인 플레이어 (&6{PLAYERCOUNT}&7): {PLAYERLIST}'

# ============================================================
# Vault 통합
# ============================================================
use-bukkit-permissions: false
# LuckPerms 사용

# ============================================================
# 성능 설정
# ============================================================
# 비동기 작업
async-teleport: true

# ============================================================
# 추천 권한 설정
# ============================================================
# 기본 플레이어:
# - essentials.spawn
# - essentials.home
# - essentials.sethome
# - essentials.tpa
# - essentials.tpaccept
# - essentials.msg
# - essentials.balance
# - essentials.pay
# - essentials.kit.starter
#
# 관리자:
# - essentials.* (모든 권한)
