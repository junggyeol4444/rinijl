# ============================================================
# CombatLogX 설정 파일
# 전투 중 로그아웃 방지 - Mineage Hybrid 서버용
# ============================================================

# ============================================================
# 기본 설정
# ============================================================
# 전투 태그 지속 시간 (초)
combat-timer: 15
# 15초 동안 전투 상태 유지

# ============================================================
# 전투 태그 조건
# ============================================================
tag-on:
  # 플레이어 공격 시
  player-damage: true
  
  # 몹 공격 시
  mob-damage: true
  
  # 플레이어가 공격받을 시
  player-attack: true
  
  # 몹이 공격할 시
  mob-attack: true

# ============================================================
# 전투 중 행동 제한
# ============================================================
punish:
  # 전투 중 로그아웃 시
  on-logout:
    enabled: true
    
    # 처벌 방법
    kill-player: true
    # 플레이어 사망 처리
    
    # 아이템 드랍
    drop-items: true
    
    # 경험치 손실
    exp-loss: 0.1
    # 10% 경험치 손실

# ============================================================
# 전투 중 명령어 제한
# ============================================================
blocked-commands:
  # 전투 중 사용 불가 명령어
  enabled: true
  
  # 차단할 명령어 목록
  commands:
    - 'spawn'
    - 'home'
    - 'tpa'
    - 'tpaccept'
    - 'warp'
    - 'back'
    - 'fly'
    - 'tp'
    - '전직'

# ============================================================
# 메시지 설정
# ============================================================
messages:
  # 전투 시작 메시지
  tag-start: '&c전투 상태! &e{time}초 &c동안 로그아웃 불가!'
  
  # 전투 종료 메시지
  tag-end: '&a전투 상태 종료. 이제 안전합니다.'
  
  # 로그아웃 시도 메시지
  logout-blocked: '&c전투 중에는 로그아웃할 수 없습니다!'
  
  # 명령어 차단 메시지
  command-blocked: '&c전투 중에는 이 명령어를 사용할 수 없습니다!'

# ============================================================
# 액션바 표시
# ============================================================
action-bar:
  # 액션바 활성화
  enabled: true
  
  # 표시 형식
  format: '&c전투 중: &e{time}초 남음'

# ============================================================
# 보스바 표시
# ============================================================
boss-bar:
  # 보스바 활성화
  enabled: true
  
  # 보스바 색상
  color: RED
  
  # 보스바 스타일
  style: SEGMENTED_10
  
  # 표시 텍스트
  message: '&c전투 중: {time}초'

# ============================================================
# 전투 NPC (로그아웃 시 남는 NPC)
# ============================================================
combat-npc:
  # NPC 생성 활성화
  enabled: true
  
  # NPC 지속 시간 (초)
  duration: 30
  # 30초 동안 NPC가 남아있음
  
  # NPC 체력
  health: 20
  
  # NPC가 받는 데미지
  damage-multiplier: 1.0

# ============================================================
# 예외 설정
# ============================================================
exemptions:
  # 전투 태그 면제 권한
  # combatlogx.bypass (권한 부여 시 면제)
  
  # 안전 지역 (WorldGuard 연동)
  safe-zones:
    enabled: true
    
    # 안전 지역 목록
    regions:
      - 'spawn'
      # 스폰 지역은 전투 태그 없음

# ============================================================
# 통합 설정
# ============================================================
integrations:
  # WorldGuard 연동
  worldguard:
    enabled: true
  
  # Factions 연동
  factions:
    enabled: true
    
    # 자기 영지에서는 전투 태그 없음
    safe-in-own-territory: true

# ============================================================
# 성능 설정
# ============================================================
performance:
  # 비동기 처리
  async-checks: true
