# ============================================================
# Jobs Reborn 설정 파일
# 직업 시스템 - Mineage Hybrid 서버용
# DB 금지 - SQLite 사용
# ============================================================

# ============================================================
# 데이터베이스 설정
# ============================================================
storage-method: sqlite
# sqlite: 파일 기반 데이터베이스
# h2: 대안
# mysql: 사용 금지

# ============================================================
# 일반 설정
# ============================================================
# 동시에 가질 수 있는 직업 수
max-jobs: 3
# 최대 3개 직업

# 직업 탈퇴 비용 (아데나)
leave-job-cost: 10000
# 1만 아데나

# 직업 최대 레벨
max-level: 100

# ============================================================
# 경제 설정
# ============================================================
economy:
  # Vault 연동
  use-vault: true
  
  # 최소 지급 금액
  minimum-payment: 0.01

# ============================================================
# 경험치 설정
# ============================================================
experience:
  # 경험치 배율
  global-exp-multiplier: 1.0
  
  # 레벨업 공식
  formula: 100*(level)^2

# ============================================================
# 직업 별 설정 파일 위치
# ============================================================
# plugins/Jobs/jobs/ 폴더에 각 직업 설정 파일 필요
# - Miner.yml (채광사)
# - Woodcutter.yml (벌목꾼)
# - Digger.yml (굴착사)
# - Farmer.yml (농부)
# - Hunter.yml (사냥꾼)
# - Fisherman.yml (어부)
# - Weaponsmith.yml (무기제작자)
# - Brewer.yml (양조사)

# ============================================================
# 보너스 설정
# ============================================================
bonus:
  # 레벨업 시 보너스
  level-up-rewards:
    enabled: true

# ============================================================
# 보드 설정
# ============================================================
scoreboard:
  # 스코어보드 표시
  enabled: true

# ============================================================
# 제한 설정
# ============================================================
limit:
  # 일일 수입 제한
  money-limit:
    enabled: false
  
  # 일일 경험치 제한
  exp-limit:
    enabled: false

# ============================================================
# 채팅 설정
# ============================================================
# 레벨업 알림
announce-level-up: true

# ============================================================
# 퀘스트 설정
# ============================================================
quests:
  enabled: false
  # BetonQuest 사용

# ============================================================
# GUI 설정
# ============================================================
gui:
  use-gui: true
  # GUI로 직업 선택

# ============================================================
# 성능 설정
# ============================================================
# 비동기 작업
async-save: true
