# ============================================================
# 채광사 (Miner) 직업 설정
# ============================================================
Miner:
  # 직업 이름
  fullname: '채광사'
  
  # 직업 설명
  description: '광물을 캐서 돈을 벌어요'
  
  # 최대 레벨
  max-level: 100
  
  # 보상 설정
  Break:
    # 돌 채굴
    STONE:
      income: 1.0
      # 1 아데나
      exp: 0.5
    
    # 석탄 광석
    COAL_ORE:
      income: 2.0
      exp: 1.0
    
    # 철 광석
    IRON_ORE:
      income: 5.0
      exp: 2.0
    
    # 금 광석
    GOLD_ORE:
      income: 10.0
      exp: 5.0
    
    # 다이아몬드 광석
    DIAMOND_ORE:
      income: 50.0
      exp: 20.0
    
    # 에메랄드 광석
    EMERALD_ORE:
      income: 100.0
      exp: 30.0
